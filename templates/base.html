{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>{{ office.title|default:"Pratiphalon" }} — Employee Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1">
  {% block extra_head %}{% endblock %}
</head>
<style>
  /* ===== MOBILE RESPONSIVE ===== */
/* ===== Hamburger Menu Button ===== */
.menu-btn {
  display: none;              /* Desktop এ লুকানো */
  background: #6366f1;        /* নীল রঙ */
  color: #fff;                /* সাদা আইকন */
  border: none;               /* কোনো border নেই */
  border-radius: 8px;         /* গোল কোণ */
  padding: 8px 12px;          /* ভিতরের padding */
  font-size: 16px;            /* আইকন সাইজ */
  cursor: pointer;            /* মাউস pointer */
  margin-right: 12px;         /* ডানদিকে ফাঁকা */
}

.menu-btn:hover {
  background: #4f46e5;        /* Hover এ গাঢ় নীল */
}

/* Mobile/Tablet এ দেখাবে */
@media (max-width: 992px) {
  .menu-btn {
    display: block !important;  /* Mobile এ দেখাবে */
  }
}
/* Tablet (768px এর নিচে) */
@media (max-width: 992px) {
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    box-shadow: none;
  }
  
  .sidebar.show {
    transform: translateX(0);
    box-shadow: 4px 0 20px rgba(0,0,0,0.15);
  }
  
  .sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 99;
  }
  
  .sidebar-backdrop.show {
    display: block;
  }
  
  .main-content {
    margin-left: 0 !important;
    width: 100% !important;
  }
  
  .menu-btn {
    display: block !important;
  }
}

/* Mobile (576px এর নিচে) */
@media (max-width: 576px) {
  /* Top bar adjustments */
  .top-bar {
    padding: 12px 16px !important;
    flex-wrap: wrap;
    gap: 8px;
  }
  
  .top-bar h4 {
    font-size: 16px !important;
  }
  
  .top-chip {
    gap: 8px;
  }
  
  .chip-avatar, .chip-avatar-img {
    width: 32px !important;
    height: 32px !important;
  }
  
  .chip-name {
    font-size: 12px !important;
  }
  
  .chip-role {
    font-size: 10px !important;
  }
  
  .role-badge {
    font-size: 10px !important;
    padding: 3px 8px !important;
  }
  
  /* Stats cards */
  .ar-stats, .cr-stats {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 8px !important;
  }
  
  .ar-stat, .cr-stat {
    padding: 10px !important;
  }
  
  .ar-stat .val, .cr-stat .val {
    font-size: 20px !important;
  }
  
  /* Charts grid */
  .cr-grid {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }
  
  .cr-card {
    padding: 14px !important;
  }
  
  /* Filter bar */
  .cr-filter-grid {
    grid-template-columns: 1fr !important;
  }
  
  .cr-filter-actions {
    justify-content: stretch !important;
  }
  
  .cr-btn {
    flex: 1;
    justify-content: center;
  }
  
  /* Tables */
  .ar-card, .cr-card {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  
  .ar-card table, .cr-card table {
    min-width: 700px;
  }
  
  /* Buttons */
  .ar-dl, .cr-btn {
    font-size: 11px !important;
    padding: 6px 12px !important;
  }
  
  /* Header */
  .cr-header, .ar-header {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  
  .cr-header h4, .ar-header h4 {
    font-size: 18px !important;
  }
  
  .ar-tabs, .cr-days {
    justify-content: center;
    flex-wrap: wrap;
  }
  
  /* Monthly targets */
  .mt-header {
    flex-direction: column;
    align-items: stretch;
  }
  
  .mt-nav {
    justify-content: center;
  }
  
  .mt-month-label {
    min-width: auto;
    flex: 1;
  }
  
  /* Form inputs */
  .mt-hours-inp {
    width: 80px !important;
  }
  
  .mt-remark-inp {
    width: 120px !important;
  }
}

/* Very small mobile (375px এর নিচে) */
@media (max-width: 375px) {
  .ar-stats, .cr-stats {
    grid-template-columns: 1fr !important;
  }
  
  .top-chip .d-none {
    display: none !important;
  }
}
</style>
<body>
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
